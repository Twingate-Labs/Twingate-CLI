name: tests

# Runs the test suite on every pull request and on every push to main.
# Nothing here uses secrets or a Twingate tenant: the tests use in-memory fakes
# and a fake keychain, so the workflow is safe for pull requests from forks.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    # Windows is reported but does not block a merge yet: the suite has never
    # run there, so a first failure is a finding to fix, not a broken change.
    # Remove this line once it has been green.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # pyproject.toml says requires-python >=3.10, so test the oldest and a
        # current release.
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install tgcli and the test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: The command starts
        run: tgcli --version

      - name: Run the tests
        run: python -m pytest -q
